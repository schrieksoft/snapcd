        in: path
        description: Organization ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: The Agent to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateDto'
          text/json:
            schema:
              $ref: '#/components/schemas/AgentCreateDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AgentCreateDto'
        required: true
      responses:
