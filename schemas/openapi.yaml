openapi: 3.1.1
info:
  title: Snap CD API
  version: 1.0.0
paths:
  /api/organization/switch/{organizationId}:
    get:
      tags:
      - OrganizationSwitch
      description: |-
        ##### Required permissions

        Session helper: requires only membership of the target organization.
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: returnUrl
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
      x-snapcd-permissions:
        notes: 'Session helper: requires only membership of the target organization.'
  /api/organization/clear:
    post:
      tags:
      - OrganizationSwitch
      description: |-
        ##### Required permissions

        Session helper: requires only membership of the target organization.
      responses:
        '200':
          description: OK
      x-snapcd-permissions:
        notes: 'Session helper: requires only membership of the target organization.'
