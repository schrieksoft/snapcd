  /api/{organizationId}/MissionRun/{runId}/cancel:
    post:
      tags:
      - MissionRun
      summary: 'Cancel an in-flight run: flag it and ask the owning instance to abort the agent.'
      description: |-
        ##### Required permissions

        Any of:
        - `Organization.Contributor`
        - `Organization.JobManager`
        - `Organization.Owner`
        - `Organization.StackContributor`
        - `Stack.Contributor`
        - `Stack.JobManager`
        - `Stack.Owner`
        - `Namespace.Contributor`
        - `Namespace.JobManager`
        - `Namespace.Owner`
        - `Module.Contributor`
        - `Module.JobManager`
        - `Module.Owner`
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      x-snapcd-permissions:
        verb: RunJob
        anyOf:
        - Organization.Contributor
        - Organization.JobManager
        - Organization.Owner
        - Organization.StackContributor
        - Stack.Contributor
        - Stack.JobManager
        - Stack.Owner
        - Namespace.Contributor
        - Namespace.JobManager
        - Namespace.Owner
        - Module.Contributor
        - Module.JobManager
        - Module.Owner
  /api/{organizationId}/MissionRun/rerun/{missionId}:
