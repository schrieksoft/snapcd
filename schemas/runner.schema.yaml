$schema: https://json-schema.org/draft/2020-12/schema
$id: https://docs.snapcd.io/schemas/runner/latest/appsettings-schema.json
title: SnapCD runner settings
type: object
properties:
  Server:
    type: object
    properties:
      Url:
        type: string
        description: Base URL of the Snap CD Server, including scheme and port. The Runner opens its SignalR connection to
          {Url}/runnerhub and obtains JWTs from {Url}/connect/token.
    description: Coordinates of the Snap CD Server the Runner connects to.
    required:
    - Url
  WorkingDirectory:
    type: object
    properties:
      WorkingDirectory:
        type: string
        description: Root directory under which the Runner persists fetched Module source, engine state and per-Job outputs.
          Must be writable by the Runner process. Typically ~/.snapcd/runner.
      TempDirectory:
        type: string
        description: Directory for ephemeral per-Job scratch space. Cleaned between Jobs. Typically ~/.snapcd/runner/.temp.
    description: Filesystem locations the Runner uses for fetched Module source and ephemeral state. Both paths support leading
      ~ expansion to the host user's home directory.
  Runner:
    type: object
    properties:
      OrganizationId:
        type: string
        format: uuid
        description: Identifier of the Organization this Runner belongs to. Must match the Organization the Runner record
          below was created in.
      Instance:
        type: string
        description: Name this Runner reports when it connects, used to distinguish replicas when allow_multiple_instances
          is set on the Runner record. Visible in the Dashboard's Runners page next to the parent record.
      Id:
        type: string
        format: uuid
        description: Identifier of the Runner record on the Server this process binds to.
      Credentials:
        type: object
        properties:
          ClientId:
            type: string
            description: The Service Principal's client identifier, prefixed with the Organization ID at the token endpoint
              (the prefix is added automatically by the Runner; supply only the raw client ID here).
          ClientSecret:
            type: string
            description: The Service Principal's client secret. Sensitive — production deployments should source this via
              the External Settings provider rather than committing it to appsettings.json.
        description: Service Principal credentials the Runner authenticates with. The Service Principal referenced here must
          be the one bound to the Runner record via service_principal_id.
        required:
        - ClientId
        - ClientSecret
    description: Identity, organisation and credentials that bind this Runner process to a Runner record on the Server. All
      four fields are required for the Runner to authenticate and connect.
    required:
    - OrganizationId
    - Id
  HooksPreapproval:
    type: object
    properties:
      Enabled:
        type: boolean
        description: Enable or disable hook pre-approval validation. When enabled, all incoming hooks must match a pre-approved
          hook from the PreapprovedHooksDirectory.
      PreapprovedHooksDirectory:
        type: string
        description: Directory containing pre-approved hook scripts. Each file in this directory is considered a pre-approved
          hook. File names don't matter - only file content is used for validation.
    description: Optional content-based allowlist for Hook scripts the Runner is permitted to execute. When enabled, every
      Hook a Job tries to run must match (by SHA256) a file in the allowlist directory or it is refused. Intended for security-sensitive
      deployments where the set of shippable Hooks must be reviewed out-of-band.
  Engine:
    type: object
    properties:
      AdditionalBinaryPaths:
        type: array
        items:
          type: string
        description: Extra directories prepended to the Runner's binary-search path. Supports leading ~ expansion. Useful
          when an engine ships in a non-standard location — for example ~/.pulumi/bin for a per-user Pulumi install.
    description: Discovery hints for the engine binaries (terraform, tofu, pulumi) the Runner invokes per Job. The Runner
      looks for binaries on PATH first; entries here extend that search.
  JobLogStream:
    type: object
    properties:
      BatchSizeLimit:
        type: integer
        description: Maximum number of log events to ship in a single batch. The PeriodicBatchingSink will flush early when
          this size is reached even before PeriodSeconds elapses.
        default: 50
      PeriodSeconds:
        type: integer
        description: Maximum wall-clock interval, in seconds, between batch flushes. A batch ships whenever either BatchSizeLimit
          or this period is reached.
        default: 5
      EagerlyEmitFirstEvent:
        type: boolean
        description: When true, the first event in a fresh batch is emitted immediately rather than waiting for the period
          or size threshold. Keeps initial job output responsive.
        default: true
    description: Tunables for the per-Job log shipping pipeline that streams engine output back to the Server over SignalR.
      Defaults are sensible for typical workloads; tune BatchSizeLimit and PeriodSeconds together if you need lower per-log
      latency at the cost of more frequent network round-trips.
  SourceCache:
    type: object
    properties:
      MaxSizeMb:
        type: integer
        description: Maximum total size of the bare-clone cache in megabytes. When exceeded, least-recently-used clones are
          evicted (and re-cloned on next use). 0 (default) disables eviction.
      BlobFilterEnabled:
        type: boolean
        description: 'When true, clones are blob-filtered (--filter=blob:none): smaller on disk and faster to create for repositories
          carrying large binary artifacts, at the cost of referenced-folder discovery lazily fetching each previously-unseen
          terraform file over the network one round trip at a time whenever a commit changes it. False (default) uses full
          bare clones: new blobs arrive batched in the regular fetch, keeping discovery entirely local — the right trade for
          typical text-only terraform repositories.'
      InspectBinaryPath:
        type: string
        description: Executable used for referenced-folder discovery during path-aware refreshes. By default the Runner uses
          the snapcd-inspect binary embedded in its own build (extracted to &lt;WorkingDirectory&gt;/tools on first use),
          falling back to "snapcd-inspect" on PATH when no binary is embedded. Set an explicit path to override both; when
          no binary is available at all, refreshes proceed without discovery (declared paths only).
        default: snapcd-inspect
    description: Tuning for the bare-clone cache the Runner keeps for path-aware source refreshes. Clones live under &lt;WorkingDirectory&gt;/sourcecache
      and are metadata-only (blob-filtered) where the git host supports it.
  Logging:
    type: object
    description: Standard .NET Logging configuration. See https://learn.microsoft.com/dotnet/core/extensions/logging-configuration
      for the full reference. Provider-specific sub-blocks (Console, Debug, EventSource, etc.) are accepted but not enumerated
      here.
    properties:
      LogLevel:
        type: object
        description: Map of log category names (or category prefixes) to minimum log levels. 'Default' applies when no more-specific
          category matches; longer keys override shorter ones (Microsoft.AspNetCore beats Microsoft beats Default).
        additionalProperties:
          type: string
          enum:
          - Trace
          - Debug
          - Information
          - Warning
          - Error
          - Critical
          - None
    additionalProperties: true
additionalProperties: true
