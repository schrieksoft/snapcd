name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for GitVersion

      # `+norelease` is ours, not GitVersion's. The `+semver:` directives describe what a
      # commit contributes to the version calculation; none of them means "do not publish",
      # and `+semver: none` in particular means "ignore semver directives here and take the
      # branch default" — a versioning knob, not a release switch. Read before GitVersion
      # runs, since it needs nothing but the commit message.
      - name: Check for +norelease
        id: norelease
        run: |
          if git log -1 --format=%B | grep -qiE '\+norelease\b'; then
            echo "Commit carries +norelease — this commit will not publish a release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: 5.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v3.1.11
        id: gitversion
        with:
          useConfigFile: true
          configFilePath: gitversion.yaml

      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.SemVer }}"

      # `+semver: none` tells GitVersion not to increment, so the computed version equals the
      # tag that already exists. Without this gate the job would go on to overwrite the
      # published container images for that version and then fail at `gh release create` with
      # "tag_name already exists" — a red build *and* mutated artifacts. Everything that
      # publishes is therefore skipped when the version has not moved. Build and test still
      # run: a no-release commit should still be verified.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/snapcd-inspect/go.mod

      - name: Build snapcd-inspect
        run: |
          # Static linux binary for referenced-folder discovery during path-aware source
          # refreshes. Placed in SnapCd.Runner/EmbeddedTools BEFORE dotnet publish so the
          # runner embeds it as a resource and extracts it at runtime — every distribution
          # channel (images, zipped binaries) carries it with no separate install.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C tools/snapcd-inspect -o "$GITHUB_WORKSPACE/SnapCd.Runner/EmbeddedTools/snapcd-inspect" .

      - name: Publish binaries
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
          SHORT_SHA: ${{ steps.gitversion.outputs.ShortSha }}
        run: |
          # InformationalVersion gets a +sha suffix so deployed images can be traced
          # back to the exact commit. AssemblyVersion / FileVersion are derived from
          # /p:Version automatically (must stay 4-part numeric).
          dotnet publish SnapCd.Server.Host/SnapCd.Server.Host.csproj \
            -c Release -o out/snapcd-server \
            /p:Version=$SEMVER \
            /p:InformationalVersion=$SEMVER+$SHORT_SHA
          dotnet publish SnapCd.Runner/SnapCd.Runner.csproj \
            -c Release -o out/snapcd-runner \
            -r linux-x64 --self-contained \
            /p:Version=$SEMVER \
            /p:InformationalVersion=$SEMVER+$SHORT_SHA
          dotnet publish SnapCd.Agent/SnapCd.Agent.csproj \
            -c Release -o out/snapcd-agent \
            -r linux-x64 --self-contained \
            /p:Version=$SEMVER \
            /p:InformationalVersion=$SEMVER+$SHORT_SHA

      - name: Zip binaries
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          mkdir -p release-assets
          for d in out/*/; do
            name="$(basename "$d")"
            cp LICENSE.md "$d"
            (cd out && zip -r "../release-assets/${name}-${SEMVER}.zip" "$name")
          done
          ls -la release-assets

      - name: Stage docs artifacts
        if: steps.norelease.outputs.skip != 'true'
        # The committed settings schemas and OpenAPI document are published as loose
        # release assets so snapcd-docs can fetch them by tag without checking out
        # this repo. They are kept current by the pre-commit hooks
        # (scripts/check-settings-schemas.sh, scripts/check-openapi-document.sh).
        #
        # The OpenAPI document is regenerated here rather than copied: info.version comes
        # from the assembly, which only carries the release string in a CI build, so the
        # committed copy always reads 1.0.0. SNAPCD_VERSION stamps the real one, which the
        # docs site and the Terraform provider then inherit.
        env:
          SNAPCD_VERSION: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          ./scripts/check-openapi-document.sh --write
          cp schemas/server.schema.yaml \
             schemas/runner.schema.yaml \
             schemas/agent.schema.yaml \
             schemas/openapi.yaml \
             release-assets/
          ls -la release-assets

      - name: Pack libraries
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          dotnet pack SnapCd.Contracts/SnapCd.Contracts.csproj \
            -c Release -o nupkgs /p:Version=$SEMVER
          dotnet pack SnapCd.Server.Core/SnapCd.Server.Core.csproj \
            -c Release -o nupkgs /p:Version=$SEMVER

      - name: Push to GitHub Packages
        if: github.ref == 'refs/heads/main' && steps.norelease.outputs.skip != 'true'
        # Pushes to schrieksoft/snapcd-lib (repo association is set via RepositoryUrl in
        # each csproj). The auto GITHUB_TOKEN is scoped to this repo (snapcd) and cannot
        # publish packages targeting a different repo, so we use a classic PAT
        # (scopes: write:packages, repo) stored as PACKAGES_WRITE_TOKEN.
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source "https://nuget.pkg.github.com/schrieksoft/index.json" \
            --api-key ${{ secrets.PACKAGES_WRITE_TOKEN }} \
            --skip-duplicate

      - name: Log in to the Container registry
        if: steps.norelease.outputs.skip != 'true'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker (Server)
        if: steps.norelease.outputs.skip != 'true'
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: "ghcr.io/schrieksoft/snapcd/snapcd-server"

      - name: Extract metadata for Docker (Runner)
        if: steps.norelease.outputs.skip != 'true'
        id: meta-runner
        uses: docker/metadata-action@v5
        with:
          images: "ghcr.io/schrieksoft/snapcd/snapcd-runner"

      - name: Extract metadata for Docker (Runner Azure)
        if: steps.norelease.outputs.skip != 'true'
        id: meta-runner-azure
        uses: docker/metadata-action@v5
        with:
          images: "ghcr.io/schrieksoft/snapcd/snapcd-runner-azure"

      - name: Extract metadata for Docker (Agent)
        if: steps.norelease.outputs.skip != 'true'
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: "ghcr.io/schrieksoft/snapcd/snapcd-agent"

      - name: Extract metadata for Docker (Agent Sidecar Claude)
        if: steps.norelease.outputs.skip != 'true'
        id: meta-agent-sidecar-claude
        uses: docker/metadata-action@v5
        with:
          images: "ghcr.io/schrieksoft/snapcd/snapcd-agent-sidecar-claude"

      - name: Build and push Docker image (Server)
        if: steps.norelease.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: "SnapCd.Server.Host/Dockerfile"
          push: true
          tags: "ghcr.io/schrieksoft/snapcd/snapcd-server:${{ steps.gitversion.outputs.SemVer }}"
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Build and push Docker image (Runner)
        if: steps.norelease.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: "SnapCd.Runner/Dockerfile"
          push: true
          tags: "ghcr.io/schrieksoft/snapcd/snapcd-runner:${{ steps.gitversion.outputs.SemVer }}"
          labels: ${{ steps.meta-runner.outputs.labels }}

      - name: Build and push Docker image (Runner Azure)
        if: steps.norelease.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: "SnapCd.Runner/Dockerfile.azure"
          push: true
          tags: "ghcr.io/schrieksoft/snapcd/snapcd-runner-azure:${{ steps.gitversion.outputs.SemVer }}"
          labels: ${{ steps.meta-runner-azure.outputs.labels }}

      - name: Build and push Docker image (Agent)
        if: steps.norelease.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: "SnapCd.Agent/Dockerfile"
          push: true
          tags: "ghcr.io/schrieksoft/snapcd/snapcd-agent:${{ steps.gitversion.outputs.SemVer }}"
          labels: ${{ steps.meta-agent.outputs.labels }}

      - name: Build and push Docker image (Agent Sidecar Claude)
        if: steps.norelease.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          # Sidecar Dockerfile expects pyproject.toml at the build context root, so the
          # context is the sidecar dir itself rather than the snapcd repo root.
          context: "SnapCd.Agent/Sidecars/Claude"
          file: "SnapCd.Agent/Sidecars/Claude/Dockerfile"
          push: true
          tags: "ghcr.io/schrieksoft/snapcd/snapcd-agent-sidecar-claude:${{ steps.gitversion.outputs.SemVer }}"
          labels: ${{ steps.meta-agent-sidecar-claude.outputs.labels }}

      - name: Release
        if: github.ref == 'refs/heads/main' && steps.norelease.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # Notes come from the <!-- release-notes --> block in the merge commit, which
          # GitHub pre-fills from the PR description. Falls back to the commit subject,
          # so a release never fails for want of a description.
          ./scripts/release-notes.sh > "$RUNNER_TEMP/release-notes.md"
          echo "--- release notes ---"
          cat "$RUNNER_TEMP/release-notes.md"

          # --title explicitly: without it the release has no name and GitHub falls back to
          # rendering the first line of the body as the heading. The name is the bare version;
          # the descriptive heading lives in the notes.
          gh release create ${{ steps.gitversion.outputs.SemVer }} \
            --title "${{ steps.gitversion.outputs.SemVer }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            -R https://github.com/schrieksoft/snapcd \
            release-assets/*.zip \
            release-assets/*.yaml

      - name: Notify downstream consumers
        # Fires repository_dispatch on every repo that pins a snapcd-published
        # NuGet package or container image. The downstream Renovate workflow
        # listens on event_type=snapcd-released and opens a grouped bump PR.
        # SNAPCD_DOWNSTREAM_DISPATCH_TOKEN is a fine-grained PAT scoped to the
        # listed downstream repos with Contents: Read and write (the only
        # permission required by POST /repos/{owner}/{repo}/dispatches).
        if: github.ref == 'refs/heads/main' && steps.norelease.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SNAPCD_DOWNSTREAM_DISPATCH_TOKEN }}
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          for repo in \
              snapcd-saas \
              snapcd-deployment-docker \
              snapcd-deployment-kubernetes \
              snapcd-deployment-local \
              snapcd-docs \
              terraform-provider-snapcd \
              module-snapcd-runner-app; do
            echo "Dispatching snapcd-released to schrieksoft/${repo}"
            gh api "repos/schrieksoft/${repo}/dispatches" \
              -f event_type=snapcd-released \
              -f "client_payload[version]=${SEMVER}" || echo "  (dispatch failed; continuing)"
          done
