repos:
  - repo: local
    hooks:
      - id: license-header
        name: License header (.cs / .razor / .py / .sql)
        entry: scripts/check-license-header.sh --apply
        language: system
        files: \.(cs|razor|py|sql)$
        exclude: |
          (?x)^(
              .*/(bin|obj)/.*
            | .*\.Designer\.cs
            | .*\.g\.cs
            | .*\.generated\.cs
            | .*GlobalUsings\.g\.cs
          )$
      - id: generated-artifacts
        name: Generated artifacts (MCP surface, OpenAPI document, settings schemas)
        # One shared build of all generators (single MSBuild invocation), then the three
        # checks run --no-build in parallel.
        entry: scripts/check-generated-artifacts.sh --write
        language: system
        pass_filenames: false
        # Union of the triggers of the three underlying checks: controllers, Mcp attributes,
        # DTOs, OpenAPI setup, settings POCOs, the generators themselves, and the committed
        # artifacts.
        files: |
          (?x)^(
              SnapCd\.Server\.Core/Controllers/.*\.cs
            | SnapCd\.Contracts/Mcp/.*\.cs
            | SnapCd\.Server\.Core/AI/Mcp/Generated/.*\.cs
            | SnapCd\.Contracts/Dto/.*\.cs
            | SnapCd\.Server\.Core/Startup/(Scalar|Controllers|CurrentOrganizationOperationTransformer)\.cs
            | SnapCd\.Runner/Settings/.*\.cs
            | SnapCd\.Agent/Configuration/.*\.cs
            | SnapCd\.Server\.Core/Settings/.*\.cs
            | SnapCd\.Utils/Settings/.*\.cs
            | generators/.*\.(cs|csproj|proj)
            | schemas/openapi\.yaml
            | schemas/.*\.schema\.yaml
          )$
