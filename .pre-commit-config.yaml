repos:
  - repo: local
    hooks:
      - id: license-header
        name: License header (.cs / .razor / .py / .sql)
        entry: scripts/check-license-header.sh --apply
        language: system
        files: \.(cs|razor|py|sql)$
        exclude: |
          (?x)^(
              .*/(bin|obj)/.*
            | .*\.Designer\.cs
            | .*\.g\.cs
            | .*\.generated\.cs
            | .*GlobalUsings\.g\.cs
          )$
      - id: mcp-surface
        name: MCP generated surface (regenerated if stale)
        entry: scripts/check-mcp-surface.sh --write
        language: system
        pass_filenames: false
        # Only run when something that could affect the generated output changes:
        # controller annotations, Mcp attribute definitions, the emitter itself, or csprojs.
        files: |
          (?x)^(
              SnapCd\.Server\.Core/Controllers/.*\.cs
            | SnapCd\.Contracts/Mcp/.*\.cs
            | generators/SnapCd\.Mcp\.Generator/.*\.(cs|csproj)
            | SnapCd\.Server\.Core/AI/Mcp/Generated/.*\.cs
          )$
      - id: openapi-document
        name: OpenAPI document (regenerated if stale)
        entry: scripts/check-openapi-document.sh --write
        language: system
        pass_filenames: false
        # Run when anything that shapes the API surface or the emitted document
        # changes: controllers, the DTOs they expose, or the OpenAPI setup.
        files: |
          (?x)^(
              SnapCd\.Server\.Core/Controllers/.*\.cs
            | SnapCd\.Contracts/Dto/.*\.cs
            | SnapCd\.Server\.Core/Startup/(Scalar|Controllers|CurrentOrganizationOperationTransformer)\.cs
            | generators/SnapCd\.OpenApi\.Generator/.*\.(cs|csproj)
            | schemas/openapi\.json
          )$
      - id: settings-schemas
        name: Settings schemas (regenerated if stale)
        entry: scripts/check-settings-schemas.sh --write
        language: system
        pass_filenames: false
        # Run when any settings POCO, generator source, shared emitter, or committed schema
        # file changes — anything that could affect the per-component schema output.
        files: |
          (?x)^(
              SnapCd\.Runner/Settings/.*\.cs
            | SnapCd\.Agent/Configuration/.*\.cs
            | SnapCd\.Server\.Core/Settings/.*\.cs
            | SnapCd\.Utils/Settings/.*\.cs
            | generators/SnapCd\.Settings\.Generator\..+/.*\.(cs|csproj)
            | schemas/.*\.schema\.json
          )$
