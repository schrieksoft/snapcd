[project]
name = "claude-sidecar"
version = "0.1.0"
description = "SnapCd Agent sidecar: runs claude-agent-sdk missions behind POST /invoke."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "claude-agent-sdk>=0.1.0",
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[tool.uv]
package = false
